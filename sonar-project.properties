# Konfigurasi analisis SonarQube. Token TIDAK ditulis di sini:
# lokal lewat variabel lingkungan SONAR_TOKEN, di CI lewat GitHub Secrets.
sonar.projectKey=PPL-IndoLegalBench-Server
sonar.projectName=PPL-IndoLegalBench Server

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.11

sonar.python.coverage.reportPaths=coverage.xml

# Migration dihasilkan Alembic, openapi.json dihasilkan FastAPI.
sonar.exclusions=migrations/**,openapi.json
