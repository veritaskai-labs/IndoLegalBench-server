# SonarQube analysis settings. The token is NOT stored here: locally it comes
# from the SONAR_TOKEN environment variable, in CI from GitHub Secrets.
sonar.projectKey=PPL-IndoLegalBench-Server
sonar.projectName=PPL-IndoLegalBench Server

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.11

sonar.python.coverage.reportPaths=coverage.xml
