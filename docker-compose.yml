# PostgreSQL untuk pengembangan lokal.
# Jalankan dengan: docker compose up -d
#
# Ini hanya untuk lokal. Staging dan production memakai database
# terkelola di Datacomm sesuai stack yang ditetapkan klien.

services:
  api:
    build: .
    container_name: indolegalbench-api
    restart: unless-stopped
    environment:
      APP_ENV: local
      DEBUG: "true"
      # Host db, bukan localhost: ini di dalam jaringan compose.
      DATABASE_URL: postgresql+psycopg://indolegalbench:indolegalbench@db:5432/indolegalbench
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: indolegalbench-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: indolegalbench
      POSTGRES_PASSWORD: indolegalbench
      POSTGRES_DB: indolegalbench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indolegalbench"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
