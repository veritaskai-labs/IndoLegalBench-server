# PostgreSQL for local development.
# Run with: docker compose up -d
#
# Local only. Staging and production use the managed database at
# Datacomm, per the stack the client specified.

services:
  api:
    build: .
    container_name: indolegalbench-api
    restart: unless-stopped
    environment:
      APP_ENV: local
      DEBUG: "true"
      # Host db, not localhost: this runs inside the compose network.
      DATABASE_URL: postgresql+psycopg://indolegalbench:indolegalbench@db:5432/indolegalbench
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: indolegalbench-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: indolegalbench
      POSTGRES_PASSWORD: indolegalbench
      POSTGRES_DB: indolegalbench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indolegalbench"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
