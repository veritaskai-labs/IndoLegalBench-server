# Aktifkan sekali per clone: pre-commit install
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Tanpa baseline, hook menolak kredensial contoh yang memang sudah
        # ada di repo. Temuan baru tetap diblokir.
        args: ['--baseline', '.secrets.baseline']
