name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Nama job dipakai branch protection sebagai required check. Jangan diganti.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Jaring kedua. Jaring pertama ada di pre-commit, tapi itu opsional per mesin.
      - name: Secret scan
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

      # Menangkap schemas.py yang berubah tapi openapi.json lupa diregenerate.
      - name: Check OpenAPI contract is up to date
        run: |
          python scripts/export_openapi.py
          if ! git diff --quiet -- openapi.json; then
            echo "::error file=openapi.json::Kontrak basi. Jalankan 'python scripts/export_openapi.py' lalu commit hasilnya."
            git --no-pager diff -- openapi.json
            exit 1
          fi

      # Dipakai frontend untuk generate tipe TypeScript. Ambil di tab Actions > Artifacts.
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: openapi.json
          retention-days: 30
          if-no-files-found: error

      # Belum dipush ke registry, baru memastikan image-nya bisa dibangun.
      - name: Build image
        run: docker build -t indolegalbench-server:${{ github.sha }} .

      - name: Smoke test image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://none:none@127.0.0.1:1/none \
            indolegalbench-server:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              curl -fsS http://localhost:8000/health; echo; exit 0
            fi
            sleep 2
          done
          echo "::error::Container tidak menjawab /health dalam 60 detik."
          docker logs api
          exit 1
