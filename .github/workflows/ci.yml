name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Branch protection uses this job name as the required check. Do not rename it.
  build:
    runs-on: ubuntu-latest
    services:
      # Same image as docker compose. pytest uses SQLite and never runs ENUM DDL.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: indolegalbench
          POSTGRES_PASSWORD: indolegalbench  # pragma: allowlist secret
          POSTGRES_DB: indolegalbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indolegalbench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Empty until the secrets are set. Read by the SonarQube step's if:.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube needs the full history to work out what is new code.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Second net. The first is pre-commit, but that is opt-in per machine.
      - name: Secret scan
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest --cov-report=xml

      # The campus SonarQube runs the community branch plugin, which detects
      # GitHub Actions on its own: a PR gets its own analysis and never touches
      # the staging dashboard.
      # On a PR into staging the step waits for the quality gate, and a red gate
      # fails the required build check, so the PR cannot merge. On a merge to
      # staging it only refreshes the dashboard and never fails the build.
      # The step skips itself while the SONAR_TOKEN secret is unset.
      - name: SonarQube scan
        id: sonar
        if: >-
          env.SONAR_TOKEN != '' && (
            (github.event_name == 'pull_request' && github.base_ref == 'staging') ||
            (github.event_name == 'push' && github.ref == 'refs/heads/staging'))
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >-
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
            -Dsonar.qualitygate.timeout=300

      # Most of us cannot open the campus SonarQube from home, so a red gate
      # prints its failed conditions, new issues and unreviewed hotspots here.
      # Issues and hotspots also show up as annotations on the PR's changed files.
      # Only reviewing a hotspot still needs the SonarQube page.
      - name: Explain a red quality gate
        if: failure() && steps.sonar.outcome == 'failure'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          key=$(sed -n 's/^sonar.projectKey=//p' sonar-project.properties)
          api() { curl -fsS -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/$1&pullRequest=$PR"; }
          strip='sub("^[^:]*:"; "")'

          echo "Failed quality gate conditions:"
          api "qualitygates/project_status?projectKey=$key" | jq -r '
            .projectStatus.conditions[] | select(.status == "ERROR")
            | "  \(.metricKey) is \(.actualValue), fails when \(if .comparator == "LT" then "below" else "above" end) \(.errorThreshold)"' \
            || echo "  could not reach SonarQube, the scan itself may have failed (see the step above)"

          echo "New issues:"
          api "issues/search?componentKeys=$key&resolved=false&ps=100" | jq -r "
            .issues[] | \"::warning file=\(.component | $strip),line=\(.line // 1)::\(.message) (\(.rule))\"" \
            || echo "  could not list issues"

          echo "Security hotspots to review on the SonarQube page:"
          api "hotspots/search?projectKey=$key&status=TO_REVIEW&ps=100" | jq -r "
            .hotspots[] | \"::warning file=\(.component | $strip),line=\(.line // 1)::Security hotspot: \(.message)\"" \
            || echo "  could not list hotspots"

      # Catches a changed schemas.py where openapi.json was not regenerated.
      - name: Check OpenAPI contract is up to date
        run: |
          python scripts/export_openapi.py
          if ! git diff --quiet -- openapi.json; then
            echo "::error file=openapi.json::Contract is stale. Run 'python scripts/export_openapi.py' and commit the result."
            git --no-pager diff -- openapi.json
            exit 1
          fi

      # Used by the frontend to generate TypeScript types. Grab it from Actions > Artifacts.
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: openapi.json
          retention-days: 30
          if-no-files-found: error

      # Not pushed to a registry yet, this only proves the image builds.
      - name: Build image
        run: docker build -t indolegalbench-server:${{ github.sha }} .

      - name: Smoke test image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://none:none@127.0.0.1:1/none \
            indolegalbench-server:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              curl -fsS http://localhost:8000/health; echo; exit 0
            fi
            sleep 2
          done
          echo "::error::Container did not answer /health within 60 seconds."
          docker logs api
          exit 1

      # /health never loads the auth modules, so a runtime dependency that
      # only lives in requirements-dev.txt slips past the smoke test. Import
      # every module inside the image, where only requirements.txt exists.
      - name: Check every app module imports in the image
        run: |
          docker run --rm indolegalbench-server:${{ github.sha }} python -c "
          import importlib, pkgutil, app
          for m in pkgutil.walk_packages(app.__path__, 'app.'):
              importlib.import_module(m.name)
          print('all app modules import')
          "

      # PBI-18: the audit migrations grant ilb_app (AC2) and ilb_retention (AC7)
      # only when the roles exist. Create them so CI exercises those branches.
      - name: Create the audit database roles
        env:
          PGPASSWORD: indolegalbench  # pragma: allowlist secret
        run: |
          psql -h 127.0.0.1 -U indolegalbench -d indolegalbench \
            -c "CREATE ROLE ilb_app NOLOGIN" \
            -c "CREATE ROLE ilb_retention NOLOGIN"

      # The enum types in the cases migration are created twice if CREATE TABLE
      # also emits CREATE TYPE. SQLite ignores that. PostgreSQL aborts the
      # whole upgrade. Run it from the runtime image against postgres:16-alpine.
      - name: Apply migrations on PostgreSQL 16
        env:
          # Same local credentials as docker-compose.yml. Not a production secret.
          DATABASE_URL: postgresql+psycopg://indolegalbench:indolegalbench@127.0.0.1:5432/indolegalbench  # pragma: allowlist secret
        run: |
          docker run --rm --network host \
            -e DATABASE_URL \
            indolegalbench-server:${{ github.sha }} \
            alembic upgrade head
          docker run --rm --network host \
            -e DATABASE_URL \
            indolegalbench-server:${{ github.sha }} \
            alembic downgrade base
          docker run --rm --network host \
            -e DATABASE_URL \
            indolegalbench-server:${{ github.sha }} \
            alembic upgrade head

      # D6c: the AC2 and AC7 tests must run on PostgreSQL. pytest above uses SQLite,
      # so prove the triggers and grants against the migrated database.
      - name: Test append-only audit log on PostgreSQL 16
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://indolegalbench:indolegalbench@127.0.0.1:5432/indolegalbench  # pragma: allowlist secret
        run: pytest tests/integration -m postgres --no-cov
