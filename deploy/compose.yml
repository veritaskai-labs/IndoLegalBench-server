# One app stack (API, web app, PostgreSQL). The VM runs two of these side by
# side, `prod` and `dev`, each from its own checkout with its own deploy/.env.
# HTTPS is the shared Caddy in deploy/proxy/, which must be up first. See
# docs/DEPLOY.md.
#
# Run from this folder:  ./deploy.sh
# Values come from deploy/.env (copy .env.example, never commit it). The
# compose project name is COMPOSE_PROJECT_NAME from that file, which keeps the
# two stacks' containers, volumes and networks apart.
#
# No service publishes ports. The API and web app are reachable only through
# Caddy on `ilb-edge`, the database only inside this stack's own network.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build: ..
    # Tagged per stack, so building dev never replaces the image prod runs.
    image: indolegalbench-server:${STACK:?set STACK in deploy/.env}
    restart: unless-stopped
    # Exactly one API container. The unfinished-login state lives in process
    # memory, so never scale this service up. See "Read this first".
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in deploy/.env}
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://indolegalbench:${POSTGRES_PASSWORD}@db:5432/indolegalbench
      CORS_ORIGINS: '["https://${WEB_DOMAIN}"]'
      AUTH_OIDC_MODE: zitadel
      PUBLIC_BASE_URL: https://${API_DOMAIN}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
      COOKIE_SECURE: "true"
      IDLE_TIMEOUT_MINUTES: "30"
      ABSOLUTE_SESSION_LIFETIME_MINUTES: "720"
      # Fernet key for AI product credentials (PBI-10). deploy.sh refuses to
      # run without it. Never change it on a running install, see DEPLOY.md.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      edge:
        aliases: ["${STACK}-api"]
    logging: *logging

  web:
    build:
      context: ${CLIENT_DIR:-../../IndoLegalBench-client}
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}
    image: indolegalbench-client:${STACK}
    restart: unless-stopped
    networks:
      edge:
        aliases: ["${STACK}-web"]
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: indolegalbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: indolegalbench
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indolegalbench"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

networks:
  # Created by deploy/proxy/compose.yml.
  edge:
    name: ilb-edge
    external: true

volumes:
  postgres_data:
    # Named in deploy/.env, not derived from the project name: dev keeps the
    # database of the single-stack layout (`deploy_postgres_data`), prod starts
    # with its own. See docs/DEPLOY.md section 11.
    name: ${POSTGRES_VOLUME:?set POSTGRES_VOLUME in deploy/.env}
